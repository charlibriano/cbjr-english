<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBJR English</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23f2b705'/><text x='50' y='66' font-size='46' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23120e02'>013</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Identidade do Quiz CBJR V2: preto, carvão e ouro #f2b705 como única cor de destaque.
   Fonte de títulos: Elektrix (copiada do repositório do Quiz para assets/). */
@font-face{font-family:'Elektrix';src:url('assets/elektrix-bold.woff2') format('woff2'),url('assets/elektrix-bold.woff') format('woff');font-weight:bold;font-display:swap}
:root{
  color-scheme:dark;
  --bg:#0a0a0a; --page:#141414; --ink:#f3f1ec; --muted:#8f8b83; --rule:#1f1f1f;
  --pen:#e74c3c; --penbg:#2a1413; --ok:#1ed760; --okbg:#0f2618; --okshadow:#0f8a3c; --penshadow:#9b2c21;
  --marker:rgba(242,183,5,.32); --line:#2c2c2c;
  --btn:#f2b705; --btnink:#120e02; --btnshadow:#8f6c00; --soft:#1b1b1b; --chip:#1b1b1b;
  --gold:#f2b705; --display:'Elektrix',Impact,'Arial Black',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* Fundo: foto do show (fundo-cbjr2 do Quiz) numa camada fixa, desbotada e com véu,
   para dar clima sem brigar com a leitura. Os cartões continuam sólidos por cima. */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:url('assets/arte/fundo-show.jpg') center 18%/cover no-repeat;filter:grayscale(.7) contrast(1.05) brightness(.9)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 90% 45% at 50% 0%,rgba(242,183,5,.10),transparent 60%),
             linear-gradient(180deg,rgba(10,10,10,.55) 0%,rgba(10,10,10,.82) 45%,rgba(10,10,10,.93) 100%)}
/* Arte dentro dos cartões, como os modos da home do Quiz: ilustração em preto e branco
   com véu, que "respira" para cor cheia por um instante a cada 7 segundos. */
.page.art{overflow:hidden;isolation:isolate}
.page.art::before{content:"";position:absolute;z-index:-1;pointer-events:none;background:var(--art) center/cover no-repeat;filter:grayscale(1) brightness(.85);animation:artbreathe 7s ease-in-out infinite}
.page.art::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.page.art-full::before,.page.art-full::after{inset:0}
.page.art-full::after{background:linear-gradient(90deg,rgba(20,20,20,.96) 30%,rgba(20,20,20,.72) 65%,rgba(20,20,20,.45))}
.page.art-top::before,.page.art-top::after{left:0;right:0;top:0;height:170px}
.page.art-top::after{background:linear-gradient(180deg,rgba(20,20,20,.35) 0%,rgba(20,20,20,.8) 60%,#141414 100%)}
.page.art-top{padding-top:118px}
@keyframes artbreathe{0%,78%,100%{filter:grayscale(1) brightness(.85)}84%,92%{filter:grayscale(0) brightness(1)}}
@media (prefers-reduced-motion:reduce){.page.art::before{animation:none}}
.topbar{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;background:rgba(8,8,8,.92);border-bottom:1px solid rgba(242,183,5,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand-mark{width:32px;height:32px;display:grid;place-items:center;background:var(--gold);color:#120e02;font-weight:900;font-size:.8rem;box-shadow:0 0 18px rgba(242,183,5,.28)}
.radio{margin-left:auto;display:flex;align-items:center;gap:6px}
.pl-cover{width:34px;height:34px;padding:0;border:1px solid rgba(242,183,5,.4);background:#1b1b1b;display:grid;place-items:center;overflow:hidden;color:var(--gold);font-size:1rem}
.pl-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pl-title{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;color:var(--muted);margin:0 4px}
.pl-btn{width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--ink)}
.pl-btn svg{width:16px;height:16px;fill:currentColor}
.pl-btn.main{background:var(--gold);color:#120e02;border-color:var(--gold)}
.pl-btn:hover,.pl-cover:hover{border-color:var(--gold)}
.pl-panel{position:fixed;top:52px;right:0;z-index:20;width:min(380px,100vw);max-height:calc(100vh - 60px);overflow:auto;background:#0e0e0e;border:1px solid rgba(242,183,5,.3);border-top:0;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.7);animation:fadein .15s ease-out}
.pl-now{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pl-now img{width:64px;height:64px;object-fit:cover;border:1px solid rgba(242,183,5,.35)}
.pl-song{font-family:var(--display);font-weight:bold;color:var(--gold);font-size:1.05rem;line-height:1.2}
.pl-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.95rem}
.pl-row input[type=range]{flex:1;accent-color:#f2b705}
.pl-row input[type=checkbox]{accent-color:#f2b705;width:18px;height:18px}
.pl-albums{display:grid;gap:6px;margin-top:6px}
.pl-al{text-align:left;background:#161616;color:var(--ink);border:1px solid rgba(255,255,255,.08);padding:9px 12px;font-size:.92rem}
.pl-al small{color:var(--muted)}
.pl-al.on{border-color:var(--gold);color:var(--gold)}
@media (max-width:560px){.pl-title{display:none}.brand-text{font-size:1.05rem}}
.brand-text{font-family:var(--display);color:var(--gold);font-size:1.3rem;line-height:1;letter-spacing:.03em;text-decoration:none}
#errbar{position:sticky;top:52px;z-index:10;background:var(--pen);color:#fff;padding:10px 16px;font-size:15px}
.wrap{max-width:680px;margin:0 auto;padding:20px 14px 60px}
.page{background:var(--page);border:1px solid rgba(255,255,255,.07);padding:24px 22px 26px;position:relative}
.page + .page{margin-top:14px}
h1{font-family:var(--display);font-weight:bold;color:var(--gold);font-size:1.9rem;line-height:1.15;margin:0 0 10px;letter-spacing:.02em}
h2{font-family:var(--display);font-weight:bold;font-size:1.3rem;line-height:1.25;margin:0 0 8px;letter-spacing:.02em}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
mark{background:linear-gradient(transparent 45%,var(--marker) 45%);color:inherit;padding:0 2px}
.hand{font-family:"Caveat","Comic Sans MS",cursive;font-size:1.45rem;line-height:1.2;color:var(--pen)}
.hand.ok{color:var(--ok)}
button{font:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--btn);color:var(--btnink);border:0;border-radius:0;padding:12px 20px;font-weight:800;font-size:1rem;letter-spacing:.02em;text-transform:uppercase;box-shadow:0 4px 0 var(--btnshadow);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--btnshadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--btn);border:2px solid var(--btn);box-shadow:0 3px 0 var(--btn)}
.btn.ghost:active{box-shadow:0 0 0 var(--btn)}
.btn.link{background:none;color:var(--muted);padding:6px 0;text-decoration:underline;font-weight:400;box-shadow:none;text-transform:none;letter-spacing:0}
.btn.link:active{transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:12px}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 14px;padding:0 4px}
.brand{font-weight:700;font-size:1.05rem}
.level{font-family:var(--display);font-size:2.8rem;line-height:1;color:var(--gold);font-weight:bold}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{text-align:left;background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:0;padding:11px 14px;font-size:1rem;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt.sel{border-color:var(--btn);background:var(--soft);box-shadow:0 3px 0 var(--btn);animation:pop .22s ease-out}
.opt.right{border-color:var(--ok);background:var(--okbg);box-shadow:0 3px 0 var(--ok);animation:bounce .5s ease-out}
.opt.wrong{border-color:var(--pen);background:var(--penbg);box-shadow:0 3px 0 var(--pen);animation:shake .4s ease-in-out}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:8px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input[type=text]:focus,textarea:focus{border-color:var(--btn);outline:none}
.q{font-size:1.2rem;line-height:1.45;margin:6px 0 4px}
.blank{display:inline-block;min-width:3.5em;border-bottom:2px solid var(--ink);color:transparent}
.kind{font-size:.9rem;color:var(--muted);margin-bottom:2px}
.progress{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin:0 0 18px}
.progress{height:14px;border-radius:7px}
.progress>i{display:block;height:100%;background:var(--gold);border-radius:7px;transition:width .5s cubic-bezier(.3,1.4,.6,1);position:relative}
.progress>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.45)}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px}
.fb.good{background:var(--okbg)}
.fb.bad{background:var(--penbg)}
.fb p:last-child{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border-radius:8px}
.chips.answer{border:2px dashed var(--line);margin:10px 0}
.chip{background:var(--chip);color:var(--ink);border:2px solid var(--line);border-radius:0;padding:6px 11px;font-size:1rem;box-shadow:0 3px 0 var(--line)}
.chip.new{animation:pop .25s ease-out}
.chip.used{visibility:hidden}
.ex{padding:10px 0;border-bottom:1px solid var(--rule)}
.ex:last-child{border-bottom:0}
.ex .en{font-weight:700}
.say{background:none;border:0;color:var(--btn);padding:2px 6px;font-size:.95rem;text-decoration:underline}
.bars{display:grid;gap:10px;margin-top:6px}
.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.95rem}
.bar .track{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--ok)}
.corr{padding:10px 0;border-bottom:1px solid var(--rule)}
.corr:last-child{border-bottom:0}
.strike{text-decoration:line-through;text-decoration-color:var(--pen);text-decoration-thickness:2px}
.score{font-family:var(--display);font-size:3.6rem;line-height:1;color:var(--pen);font-weight:bold}
.score.ok{color:var(--ok)}
.spinner{width:34px;height:34px;border:4px solid var(--rule);border-top-color:var(--btn);border-radius:50%;animation:spin 1s linear infinite;margin:10px 0 16px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
/* camada de jogo */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;font-weight:700}
.hud .combo{color:var(--pen)}
.hud .xp{color:var(--ok)}
.mute{background:none;border:0;font-size:1.2rem;padding:2px 6px}
.xpgain{display:inline-block;font-family:var(--display);font-size:1.3rem;font-weight:bold;color:var(--ok);margin-left:10px;animation:rise .7s ease-out both}
.combomsg{font-weight:700;color:var(--pen);margin:6px 0 0}
.pulse{animation:pulse .45s ease-out}
.shake{animation:shake .4s ease-in-out}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.player{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin:0 0 14px;padding:0 4px}
.player .lv{font-family:var(--display);font-size:1.7rem;font-weight:bold;line-height:1;color:var(--gold)}
.player .title{font-size:.85rem;color:var(--muted)}
.player .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:4px}
.player .track i{display:block;height:100%;background:var(--btn)}
.flame{font-weight:700;font-size:1.1rem;white-space:nowrap}
.stars{font-size:2.4rem;letter-spacing:4px;line-height:1}
.stars .on{color:var(--gold)}
.stars .off{color:var(--line)}
.stars span{display:inline-block;animation:rise .5s ease-out both}
.stars span:nth-child(2){animation-delay:.25s}
.stars span:nth-child(3){animation-delay:.5s}
.reward{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.reward div{background:var(--soft);border-radius:0;padding:10px 4px}
.reward b{display:block;font-size:1.4rem}
.levelup{background:var(--gold);color:#120e02;border-radius:0;padding:12px 14px;font-weight:700}
/* animações: mascote, painel de resposta, entrada de tela, confete */
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:none}}
@keyframes bounce{0%{transform:none}30%{transform:translateY(-6px)}60%{transform:translateY(0)}80%{transform:translateY(-2px)}100%{transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes sheetup{from{transform:translateY(110%)}to{transform:none}}
@keyframes breathe{0%,100%{transform:none}50%{transform:translateY(-2px) scaleY(1.02)}}
@keyframes blink{0%,92%,100%{transform:none}95%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:none}35%{transform:translateY(-14px) scale(1.05,.95)}55%{transform:translateY(0) scale(1.05,.92)}70%{transform:scale(.97,1.04)}}
@keyframes droop{0%{transform:none}40%{transform:rotate(-8deg) translateY(3px)}100%{transform:rotate(-5deg) translateY(4px)}}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.08) rotate(-3deg)}50%{transform:scale(.96) rotate(2deg)}75%{transform:scale(1.05) rotate(-1deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--marker)}50%{box-shadow:0 0 0 8px transparent}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.enter{animation:slidein .3s ease-out}
.mascot{display:block;flex:none;overflow:visible}
.mascot .m-body{transform-box:fill-box;transform-origin:50% 100%}
.mascot .m-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.mascot .reel{transform-box:fill-box;transform-origin:center}
.m-happy .reel,.m-cheer .reel{animation:reelspin .5s linear infinite}
.m-idle .reel{animation:reelspin 3s linear infinite}
@keyframes reelspin{to{transform:rotate(360deg)}}
.m-idle .m-body{animation:breathe 2.6s ease-in-out infinite}
.m-happy .m-body{animation:jump .6s ease-out 2}
.m-cheer .m-body{animation:jump .7s ease-out infinite}
.m-sad .m-body{animation:droop .6s ease-out forwards}
.talk{display:flex;align-items:flex-end;gap:10px;margin:0 0 12px}
.bubble{position:relative;background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;animation:pop .3s ease-out}
.bubble::before{content:"";position:absolute;left:-9px;bottom:12px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.sheet{position:sticky;bottom:0;z-index:5;margin-top:12px;border-radius:0;padding:14px 18px 18px;animation:sheetup .3s cubic-bezier(.2,1.2,.4,1)}
.sheet.good{background:var(--okbg);border-top:4px solid var(--ok)}
.sheet.bad{background:var(--penbg);border-top:4px solid var(--pen)}
.sheet .inner{max-height:48vh;overflow:auto}
.sheet p:last-child{margin-bottom:0}
.sheet .btn{width:100%;margin-top:12px}
.sheet.good .btn{background:var(--ok);box-shadow:0 4px 0 var(--okshadow)}
.sheet.bad .btn{background:var(--pen);color:#fff;box-shadow:0 4px 0 var(--penshadow)}
.sheet .btn.link{background:none;box-shadow:none;color:var(--muted);margin-top:6px}
.flame .f{display:inline-block;animation:flicker 1.2s ease-in-out infinite}
.hud .combo{display:inline-block}
.hud .combo.bump{animation:pop .35s ease-out}
.levelup{animation:pop .4s ease-out .6s both,glow 1.6s ease-in-out 1s 3}
.reward div{animation:fadeup .4s ease-out both}
.reward div:nth-child(2){animation-delay:.15s}
.reward div:nth-child(3){animation-delay:.3s}
.corr{animation:fadeup .35s ease-out both}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
/* mapa de fases */
/* O cartão da trilha fica translúcido: a foto do show aparece por trás dos discos.
   Os textos ganham sombra para continuar legíveis sobre a imagem. */
.page.trail{background:rgba(12,12,12,.38);border-color:rgba(242,183,5,.16)}
.page.trail .nl,.page.trail .kind,.page.trail .muted,.page.trail .ay,.page.trail .an,.page.trail .level{text-shadow:0 1px 3px #000,0 0 8px rgba(0,0,0,.9)}
.page.trail .nl{color:#d6d2ca}
.page.trail .progress{background:rgba(255,255,255,.12)}
.world{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.album{display:flex;gap:14px;align-items:center;margin:0 0 14px}
.album img{width:84px;height:84px;object-fit:cover;flex:none;border:1px solid rgba(242,183,5,.35);box-shadow:0 8px 24px rgba(0,0,0,.6)}
.album .an{font-family:var(--display);font-weight:bold;font-size:1.15rem;line-height:1.2;letter-spacing:.02em}
.album .ay{color:var(--muted);font-size:.85rem}
.map{position:relative;margin:18px 0 0}
/* só o SVG do caminho (filho direto do mapa); sem o '>' a regra pegava também o mascote e o escondia */
.map>svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:132px;background:none;border:0;padding:0;color:var(--ink)}
.node .dot{--sh:#000;--lbl:#3a3a3a;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem;color:#120e02;box-shadow:0 6px 0 var(--sh);transition:transform .08s,box-shadow .08s;
  background:radial-gradient(circle,var(--lbl) 0 29%,#0b0b0b 30% 33%,#1e1e1e 34% 36%,#0b0b0b 37% 44%,#1b1b1b 45% 47%,#0b0b0b 48% 57%,#1b1b1b 58% 60%,#0b0b0b 61% 100%);border:1px solid #2a2a2a}
.node:active .dot{transform:translateY(5px);box-shadow:0 1px 0 var(--sh)}
.node.done .dot{--lbl:var(--gold)}
.node.cur .dot{--lbl:var(--gold);border-color:var(--gold);animation:nodepulse 1.8s ease-out infinite}
.node.lock .dot{--lbl:#2e2e2e;color:var(--muted);font-size:.9rem}
.node.boss .dot{width:88px;height:88px;font-size:1.6rem;background:radial-gradient(circle,#0b0b0b 0 7%,transparent 8%),repeating-radial-gradient(circle,rgba(0,0,0,.18) 0 1px,transparent 1px 4px),conic-gradient(from 20deg,#f2b705,#ffe38a,#a87f00,#f2b705,#ffe38a,#a87f00,#f2b705);border-color:#8f6c00}
.node.boss.lock .dot{filter:grayscale(1) brightness(.55)}
.node .ns{font-size:.95rem;letter-spacing:2px;margin-top:9px;height:1.2em;line-height:1.2}
.node .ns .on{color:var(--gold)}.node .ns .off{color:var(--line)}
.node .nl{font-size:.8rem;line-height:1.25;color:var(--muted);margin-top:2px;max-width:128px}
.node.cur .nl{color:var(--ink);font-weight:700}
@keyframes nodepulse{0%{box-shadow:0 6px 0 var(--sh),0 0 0 0 var(--gold)}70%{box-shadow:0 6px 0 var(--sh),0 0 0 18px transparent}100%{box-shadow:0 6px 0 var(--sh),0 0 0 0 transparent}}
.mapmascot{position:absolute;display:flex;align-items:center;gap:4px;pointer-events:none}
.mapmascot .bubble{font-size:.9rem;padding:5px 9px}
.today{display:flex;align-items:center;gap:12px}
.today .grow{flex:1}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:30;animation:fadein .2s ease-out}

function playNotes(notes,type,vol,step){
  if(S.sound===false)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime;
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),st=t+i*step;
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(vol,st+0.02);g.gain.exponentialRampToValueAtTime(0.0001,st+step+0.1);
      o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+step+0.12);
    });
  }catch(e){/* sem áudio: segue sem som */}
}

  (function frame(t){
    const el=t-t0;ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-el/2800);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});
    if(el<2800)requestAnimationFrame(frame);else c.remove();
  })(t0);
}
function countUp(el){
  const to=+el.dataset.count||0;if(reduceMotion()||!to){el.textContent=to;return;}
  const t0=performance.now(),d=900;
  (function frame(t){const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(frame);})(t0);
}

function vMap(m){

const QUOTA={mcq:2,fill:2,order:1,translate:2,fix:1,listen:2};
const QUOTA_BOSS={mcq:3,fill:3,order:1,translate:3,fix:2,listen:2};
function pickExercises(pool,quota,recentKey){
  const recent=new Set((S.recent&&S.recent[recentKey])||[]);
  const out=[];
  for(const type in quota){
    // Embaralha e joga para o fim o que caiu na última vez: rejogar traz questões diferentes.
    const c=shuffle(pool.filter(e=>e.type===type&&(type!=='listen'||hasSpeech)));
    c.sort((a,b)=>(recent.has(a._id)?1:0)-(recent.has(b._id)?1:0));
    out.push(...c.slice(0,quota[type]));
  }
  S.recent=S.recent||{};S.recent[recentKey]=out.map(e=>e._id);
  return out.map(e=>{const c=JSON.parse(JSON.stringify(e));delete c._id;return c;});
}
async function newLesson(arg){
  view='loading';render();
  await ensureBank();
  const m=mapState(),today=ymd();
  let idx=(arg==null||arg==='')?m.cur:+arg;
  if(!(idx>=0)||idx>m.cur)idx=m.cur;
  const boss=idx>=m.n;
  if(!bank){fail('Não encontrei o arquivo conteudo/'+m.L+'.js. Confira se a pasta conteudo foi enviada junto com o index.html.',null);return;}
  if(boss?m.avail<m.n:!phaseOk(idx)){fail('Esta fase ainda não tem conteúdo no banco.',null);return;}
  const phs=boss?bank.phases.slice(0,m.n):[bank.phases[idx]];
  const base=boss?0:idx;
  const pool=[],pairsPool=[],lgPool=[],wPool=[];
  phs.forEach((ph,k)=>{
    (ph.exercises||[]).forEach((e,j)=>pool.push(Object.assign({},e,{_id:(base+k)+':'+j})));
    (ph.pairs||[]).forEach(x=>pairsPool.push(x));
    (ph.lightning||[]).forEach(x=>lgPool.push(x));
    (ph.writing||[]).forEach(x=>wPool.push(x));
  });
  const exercises=pickExercises(pool,boss?QUOTA_BOSS:QUOTA,m.L+':'+(boss?'boss':idx));
  const seen=new Set(),pairs=shuffle(pairsPool).filter(x=>!seen.has(x.en)&&seen.add(x.en)).slice(0,6);
  const lightning=shuffle(lgPool).slice(0,10);
  const w=wPool.length?wPool[Math.floor(Math.random()*wPool.length)]:null;
  const ph=bank.phases[idx];
  const lesson=boss
    ?{title:'Chefão do mundo '+m.L,explanation:bank.bossIntro||'Prova final: questões de todas as fases do mundo.',examples:[]}
    :{title:ph.title||m.list[idx][1],explanation:ph.explanation||'',examples:ph.examples||[]};
  lesson.writing=w?{task:w.task,models:w.models||[]}:null;
  const reviews=S.review.filter(r=>r.due<=today).slice(0,4).map(r=>Object.assign({},r.item,{reviewId:r.id}));
  const items=reviews.concat(shuffle(exercises));
  if(pairs.length>=4)items.splice(Math.floor(items.length/2),0,{type:'pairs',pairs});
  S.session={kind:S.lastDone===today?'extra':'daily',level:m.L,topicIdx:idx,boss,topic:boss?'Chefão do mundo '+m.L:'Fase '+(idx+1)+': '+m.list[idx][1],
    lesson,items,i:0,results:[],phase:'intro',writing:null,score:null,xp:0,combo:0,maxCombo:0,xpStart:S.xp||0,
    lightning:lightning.length>=6?lightning:null,lgResult:null};
  touch();save();
  resetX();view='lesson';render();window.scrollTo(0,0);
}

/* ---------- aula ---------- */
function resetX(){stopTick();X={sel:null,input:'',pool:null,order:[],checked:false,ok:null,fb:'',better:'',busy:false,enter:true,picked:-1};}
function vLesson(){
  const s=S.session;
  if(!s){view='home';return vHome();}
  if(s.phase==='intro')return vIntro(s);
  if(s.phase==='ex')return vExercise(s);
  if(s.phase==='lightning')return vLightning(s);
  if(s.phase==='writing')return vWriting(s);
  return vSummary(s);
}
function vIntro(s){
  const L=s.lesson;
  return `<div class="talk">${mascot('idle',72)}<div class="bubble">Dica rápida e já vamos jogar!</div></div>
  <div class="page enter art art-top" style="--art:url('assets/arte/caderno.jpg')">
    <div class="kind">Dica rápida antes da partida. ${esc(s.level)}: ${esc(s.topic)}</div>
    <h1>${esc(L.title)}</h1>
    ${md(L.explanation)}
  </div>
  ${L.examples.length?`<div class="page"><h2>Exemplos</h2>${L.examples.map(e=>`<div class="ex"><div class="en">${esc(e.en)} ${hasSpeech?`<button class="say" data-act="say" data-arg="${esc(e.en)}">ouvir</button>`:''}</div><div class="muted">${esc(e.pt||'')}</div></div>`).join('')}</div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn" data-act="toEx">Jogar (${s.items.length} desafios)</button><button class="btn link" data-act="goHome">Sair</button></div>`;
}
function vExercise(s){
  const it=s.items[s.i],n=s.items.length;
  let body='';
  if(it.type==='mcq'){
    body=`<p class="q">${blank(it.prompt)}</p><div class="opts">${it.options.map((o,k)=>{
      let c='';if(X.checked){if(k===it.answer)c='right';else if(k===X.sel)c='wrong';}else if(X.sel===k)c='sel';
      return `<button class="opt ${c}" data-act="sel" data-arg="${k}" ${X.checked?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>`;
  }else if(it.type==='fill'){
    body=`<p class="q">${blank(it.prompt)}</p>${it.hint?`<p class="muted small">${esc(it.hint)}</p>`:''}<input type="text" id="ans" value="${esc(X.input)}" placeholder="Palavra(s) que faltam" autocomplete="off" autocapitalize="off" spellcheck="false" ${X.checked?'disabled':'data-autofocus'}>`;
  }else if(it.type==='order'){
    if(!X.pool){const w=it.answer.trim().split(/\s+/);let sh=shuffle(w);for(let k=0;k<5&&sh.join(' ')===w.join(' ');k++)sh=shuffle(w);X.pool=sh;}
    body=`<div class="chips answer" aria-label="Sua frase">${X.order.map((pi,k)=>`<button class="chip ${k===X.picked?'new':''}" data-act="unpick" data-arg="${k}" ${X.checked?'disabled':''}>${esc(X.pool[pi])}</button>`).join('')||'<span class="muted small" style="padding:6px">Toque nas palavras na ordem certa</span>'}</div>
      <div class="chips">${X.pool.map((w,k)=>`<button class="chip ${X.order.includes(k)?'used':''}" data-act="pick" data-arg="${k}" ${X.checked?'disabled':''}>${esc(w)}</button>`).join('')}</div>`;
  }else if(it.type==='translate'){
    body=`<p class="q">${esc(it.pt)}</p><textarea id="ans" placeholder="Escreva em inglês" spellcheck="false" ${X.checked?'disabled':'data-autofocus'}>${esc(X.input)}</textarea>`;
  }else if(it.type==='fix'){
    if(!X.prefilled){X.input=it.sentence;X.prefilled=true;}
    body=`<p class="q">${esc(it.sentence)}</p><p class="muted small">Edite a frase abaixo para ela ficar correta.</p><textarea id="ans" spellcheck="false" ${X.checked?'disabled':'data-autofocus'}>${esc(X.input)}</textarea>`;
  }else if(it.type==='pairs'){
    if(X.checked){
      body=`<ul class="plist">${it.pairs.map(p=>`<li><strong>${esc(p.en)}</strong> = ${esc(p.pt)}</li>`).join('')}</ul>`;
    }else{
      if(!X.pg)X.pg={L:shuffle(it.pairs.map((_,k)=>k)),R:shuffle(it.pairs.map((_,k)=>k)),selL:null,selR:null,matched:[],mistakes:0,t0:0};
      const g=X.pg;
      body=`<div class="row" style="justify-content:space-between"><span class="muted small">Toque numa palavra em inglês e depois na tradução.</span><span class="ptimer" id="ptime">0s</span></div>
      <div class="pgrid">
        <div class="pcol">${g.L.map(k=>`<button class="pair L ${g.matched.includes(k)?'gone':''}" data-act="pairL" data-arg="${k}">${esc(it.pairs[k].en)}</button>`).join('')}</div>
        <div class="pcol">${g.R.map(k=>`<button class="pair R ${g.matched.includes(k)?'gone':''}" data-act="pairR" data-arg="${k}">${esc(it.pairs[k].pt)}</button>`).join('')}</div>
      </div>`;
    }
  }else if(it.type==='listen'){
    body=`<div class="row" style="margin:10px 0 12px"><button class="btn ghost" data-act="say" data-arg="${esc(it.text)}">Ouvir</button><button class="btn ghost" data-act="saySlow" data-arg="${esc(it.text)}">Ouvir devagar</button></div>
      <input type="text" id="ans" value="${esc(X.input)}" placeholder="Escreva o que ouviu" autocomplete="off" autocapitalize="off" spellcheck="false" ${X.checked?'disabled':'data-autofocus'}>`;
  }
  let fb='';
  if(X.checked){
    const right=rightAnswer(it);
    fb=X.ok
      ?`<div><p class="hand ok">Certo!${X.gain?`<span class="xpgain">+${X.gain} XP</span>`:''}</p>${(s.combo||0)>=3?`<p class="combomsg">Combo de ${s.combo} acertos seguidos: bônus de XP!</p>`:''}${X.fb?`<p>${esc(X.fb)}</p>`:''}${it.explain?`<p class="muted">${esc(it.explain)}</p>`:''}</div>`
      :`<div><p class="hand">${esc(X.better||right)}</p>${X.fb?`<p>${esc(X.fb)}</p>`:''}${it.explain?`<p class="muted">${esc(it.explain)}</p>`:''}${X.better&&X.better!==right?`<p class="muted small">Resposta de referência: ${esc(right)}</p>`:''}</div>`;
  }
  const canCheck=it.type==='mcq'?X.sel!==null:it.type==='order'?X.order.length>0:true;
  const anim=X.checked&&X.fresh?(X.ok?'pulse':'shake'):(X.enter?'enter':'');
  const bump=X.checked&&X.fresh&&X.ok&&(s.combo||0)>=2;
  const barTo=(s.i+(X.checked?1:0))/n*100,barFrom=lastBar;lastBar=barTo;
  const sheet=X.checked?`<div class="sheet ${X.ok?'good':'bad'}" role="status">
      <div class="talk" style="margin-bottom:6px">${mascot(X.ok?'happy':'sad',56)}<div class="bubble">${esc(X.say||'')}</div></div>
      <div class="inner">${fb}</div>
      <button class="btn" data-act="next" data-autofocus>Continuar</button>
      ${!X.ok&&['fill','translate','fix','listen'].includes(it.type)&&X.input.trim()?'<button class="btn link" data-act="override" style="width:100%">Minha resposta estava certa</button>':''}
    </div>`:'';
  X.fresh=false;X.enter=false;
  return `<div class="page ${anim}">
    <div class="hud"><span class="combo ${bump?'bump':''}">${(s.combo||0)>=2?'🔥 combo x'+s.combo:''}</span><span class="row" style="gap:4px"><span class="xp">+${s.xp||0} XP</span><button class="mute" data-act="toggleSound" aria-label="${S.sound===false?'Ligar som':'Desligar som'}">${S.sound===false?'🔇':'🔊'}</button></span></div>
    <div class="progress"><i style="width:${barFrom}%" data-w="${barTo}"></i></div>
    <div class="kind">${esc(KIND_NAME[it.type])}${it.reviewId?' (revisão de um erro seu)':''}. ${s.i+1} de ${n}</div>
    ${body}
    ${X.checked||it.type==='pairs'?'':`<div class="row" style="margin-top:16px">
      <button class="btn" data-act="check" ${(!canCheck||X.busy)?'disabled':''}>${X.busy?'Conferindo…':'Verificar'}</button>${!X.busy?'<button class="btn link" data-act="dontKnow">Não sei</button>':''}
    </div>`}
  </div>
  ${sheet}`;
}
function rightAnswer(it){
  switch(it.type){case 'mcq':return it.options[it.answer];case 'fill':case 'translate':return it.answers[0];case 'order':case 'fix':return it.answer;case 'listen':return it.text;case 'pairs':return it.pairs.map(p=>p.en+' = '+p.pt).join('; ');}
  return '';
}
function acceptKey(it){return it.type+'|'+(it.pt||it.prompt||it.sentence||it.text||'');}
function check(){
  const s=S.session,it=s.items[s.i];
  const inp=document.getElementById('ans');if(inp)X.input=inp.value;
  if(it.type==='mcq'){X.ok=X.sel===it.answer;return done();}
  if(it.type==='order'){X.ok=norm(X.order.map(k=>X.pool[k]).join(' '))===norm(it.answer);return done();}
  if(!X.input.trim()){X.ok=false;return done();}
  const refs=it.type==='listen'?[it.text]:it.type==='fix'?[it.answer]:it.answers;
  const mine=(S.accepted&&S.accepted[acceptKey(it)])||[];
  X.ok=refs.some(a=>norm(a)===norm(X.input))||mine.includes(norm(X.input));
  done();
}
// "Minha resposta estava certa": vira acerto e passa a ser aceita nas próximas vezes.
function override(){
  const s=S.session,it=s.items[s.i];
  if(!X.checked||X.ok)return;
  X.ok=true;X.fresh=true;X.overridden=true;
  X.gain=10;s.xp=(s.xp||0)+10;S.xp=(S.xp||0)+10;
  s.results[s.i]={ok:true,gain:10};
  if(X.addedRev)S.review=S.review.filter(r=>r.id!==X.addedRev);
  if(X.revPrev){
    const r=S.review.find(r=>r.id===X.revPrev.id);
    if(r){r.box=X.revPrev.box+1;if(r.box>=LEITNER.length)S.review=S.review.filter(x=>x!==r);else r.due=addDays(LEITNER[r.box]);}
  }
  if(X.input.trim()){
    S.accepted=S.accepted||{};const k=acceptKey(it);
    S.accepted[k]=Array.from(new Set([...(S.accepted[k]||[]),norm(X.input)]));
    const keys=Object.keys(S.accepted);if(keys.length>300)delete S.accepted[keys[0]];
  }
  X.fb='Marcada como certa por você. Da próxima vez essa resposta já vale.';
  X.say='Anotado!';
  sfx('ok');touch();save();render();
}
function done(){
  const s=S.session,it=s.items[s.i];
  X.checked=true;X.fresh=true;
  let gain=0;
  if(X.ok){
    s.combo=(s.combo||0)+1;s.maxCombo=Math.max(s.maxCombo||0,s.combo);
    gain=it.reviewId?15:10;
    if(s.combo>=5)gain+=10;else if(s.combo>=3)gain+=5;
    if(it.type==='pairs')gain+=X.speedBonus||0;
    sfx(s.combo>=3?'combo':'ok');X.say=phrase(s.combo>=3?'combo':'ok');
  }else{s.combo=0;sfx('bad');X.say=phrase('bad');}
  X.gain=gain;s.xp=(s.xp||0)+gain;S.xp=(S.xp||0)+gain;
  s.results[s.i]={ok:!!X.ok,gain};
  // Revisão espaçada: errou entra (ou volta) para a caixa 0; acertou uma revisão sobe de caixa.
  const clean=Object.assign({},it);delete clean.reviewId;
  if(it.reviewId){
    const r=S.review.find(r=>r.id===it.reviewId);
    X.revPrev=r?{id:r.id,box:r.box}:null;
    if(r){
      if(X.ok){r.box++;if(r.box>=LEITNER.length)S.review=S.review.filter(x=>x!==r);else r.due=addDays(LEITNER[r.box]);}
      else{r.box=0;r.due=addDays(1);}
    }
  }else if(!X.ok){
    X.addedRev='r'+Date.now()+Math.random().toString(36).slice(2,6);
    S.review.push({id:X.addedRev,item:clean,box:0,due:addDays(1),note:it.explain||rightAnswer(it)});
  }
  touch();save();render();
}
function next(){
  const s=S.session;
  s.i++;resetX();
  if(s.i>=s.items.length)s.phase=(s.lightning&&s.lightning.length&&!s.lgResult)?'lightning':(s.lesson.writing?'writing':'summary');
  if(s.phase==='summary')finishSession();
  touch();save();render();window.scrollTo(0,0);
}

/* ---------- minijogo: pares ---------- */
let tick=null,lgTimer=null;
function stopTick(){if(tick){clearInterval(tick);tick=null;}if(lgTimer){clearTimeout(lgTimer);lgTimer=null;}}
function pairTap(side,k,el){
  const it=S.session.items[S.session.i],g=X.pg;
  if(!g||X.checked||g.matched.includes(k))return;
  if(!g.t0){g.t0=Date.now();stopTick();tick=setInterval(()=>{const e=document.getElementById('ptime');if(e)e.textContent=Math.floor((Date.now()-g.t0)/1000)+'s';},250);}
  app.querySelectorAll('.pair.'+side).forEach(b=>b.classList.remove('sel'));
  el.classList.remove('bad');void el.offsetWidth;el.classList.add('sel');
  if(side==='L'){g.selL=k;if(hasSpeech&&S.sound!==false)speak(it.pairs[k].en,1);}else g.selR=k;
  if(g.selL==null||g.selR==null)return;
  const l=app.querySelector('.pair.L[data-arg="'+g.selL+'"]'),r=app.querySelector('.pair.R[data-arg="'+g.selR+'"]');
  if(g.selL===g.selR){
    const m=g.selL;g.matched.push(m);
    [l,r].forEach(b=>{b.classList.remove('sel');b.classList.add('match');});
    sfx('ok');
    setTimeout(()=>{[l,r].forEach(b=>{b.classList.remove('match');b.classList.add('gone');});},380);
    if(g.matched.length===it.pairs.length)setTimeout(finishPairs,650);
  }else{
    g.mistakes++;
    [l,r].forEach(b=>{b.classList.remove('sel');void b.offsetWidth;b.classList.add('bad');});
    sfx('bad');
    setTimeout(()=>{[l,r].forEach(b=>b.classList.remove('bad'));},450);
  }
  g.selL=g.selR=null;
}
function finishPairs(){
  const g=X.pg;stopTick();
  const sec=Math.max(1,Math.round((Date.now()-g.t0)/1000));
  X.ok=g.mistakes<=1;
  X.speedBonus=X.ok?(sec<=20?10:sec<=35?5:0):0;
  X.fb=`Tempo: ${sec}s. ${g.mistakes===0?'Nenhum erro':g.mistakes===1?'1 erro':g.mistakes+' erros'}.${X.speedBonus?` Bônus de velocidade: +${X.speedBonus} XP.`:''}${X.ok?'':' Com mais de 1 erro, esses pares voltam na revisão.'}`;
  done();
}

/* ---------- minijogo: rodada relâmpago ---------- */
const LG_SECONDS=45;
function vLightning(s){
  const r=s.lgResult;
  if(r){
    return `<div class="talk">${mascot(r.ok>=r.total*0.7?'cheer':'happy',72)}<div class="bubble">${r.ok>=r.total*0.7?'Rápido e certeiro!':'Valeu o esforço! Olha o que escapou.'}</div></div>
    <div class="page stack">
      <div class="kind">Rodada relâmpago</div>
      <div class="reward">
        <div><b>${r.ok}/${r.total}</b>acertos</div>
        <div><b>+${r.xp}</b>XP</div>
        <div><b>${r.best}</b>maior sequência</div>
      </div>
      ${r.missed.length?`<h2>O que escapou</h2>${r.missed.map((m,k)=>`<div class="corr" style="animation-delay:${k*.1}s">${m.ok?`<div>${esc(m.s)}</div><div class="muted small">Essa frase estava certa.</div>`:`<div class="strike">${esc(m.s)}</div><div class="hand">${esc(m.fix)}</div>`}</div>`).join('')}`:'<p>Nenhum erro na rodada!</p>'}
      <div class="row"><button class="btn" data-act="lgDone">Continuar</button></div>
    </div>`;
  }
  if(!X.lg){
    return `<div class="talk">${mascot('idle',72)}<div class="bubble">Rodada relâmpago!</div></div>
    <div class="page enter stack art art-full" style="--art:url('assets/arte/console.jpg')">
      <h1>${LG_SECONDS} segundos</h1>
      <p>Vão aparecer frases, uma de cada vez. Diga se cada uma está <strong>certa</strong> ou <strong>errada</strong>, o mais rápido que conseguir. Acertos seguidos valem mais XP.</p>
      <p class="muted small">No teclado: seta para a esquerda = Errada, seta para a direita = Certa.</p>
      <div class="row"><button class="btn" data-act="lgStart" data-autofocus>Começar</button></div>
    </div>`;
  }
  const g=X.lg,cur=s.lightning[g.i];
  return `<div class="page">
    <div class="lstats"><span id="lgtime">${LG_SECONDS}s</span><span class="st" id="lgstreak"></span><span class="xp" id="lgxp" style="color:var(--ok)">+0 XP</span></div>
    <div class="lbar run"><i style="animation-duration:${LG_SECONDS}s"></i></div>
    <div class="lcard in" id="lgcard">${esc(cur.s)}</div>
    <div class="lbtns"><button class="btn no" data-act="lgAns" data-arg="0">Errada</button><button class="btn yes" data-act="lgAns" data-arg="1">Certa</button></div>
  </div>`;
}
function lgStart(){
  stopTick();
  X.lg={i:0,ok:0,total:0,streak:0,best:0,xp:0,missed:[],t0:Date.now(),busy:false,over:false};
  render();
  tick=setInterval(()=>{const e=document.getElementById('lgtime');if(e&&X.lg)e.textContent=Math.max(0,LG_SECONDS-Math.floor((Date.now()-X.lg.t0)/1000))+'s';},250);
  lgTimer=setTimeout(lgEnd,LG_SECONDS*1000);
}
function lgAnswer(saysOk){
  const s=S.session,g=X.lg;
  if(!g||g.over||g.busy)return;
  const cur=s.lightning[g.i],right=cur.ok===saysOk;
  g.total++;
  if(right){g.ok++;g.streak++;g.best=Math.max(g.best,g.streak);g.xp+=g.streak>=3?10:5;sfx(g.streak>=3?'combo':'ok');}
  else{g.streak=0;g.missed.push(cur);sfx('bad');}
  const card=document.getElementById('lgcard');
  const xe=document.getElementById('lgxp'),se=document.getElementById('lgstreak');
  if(xe)xe.textContent='+'+g.xp+' XP';
  if(se){se.textContent=g.streak>=2?'🔥 x'+g.streak:'';se.classList.remove('bump');void se.offsetWidth;se.classList.add('bump');}
  g.i++;
  if(g.i>=s.lightning.length){g.busy=true;if(card){card.className='lcard '+(right?'hit':'miss');}setTimeout(lgEnd,260);return;}
  g.busy=true;
  if(card)card.className='lcard '+(right?'hit':'miss');
  setTimeout(()=>{if(!X.lg||X.lg.over)return;const c=document.getElementById('lgcard');if(c){c.textContent=s.lightning[g.i].s;c.className='lcard';void c.offsetWidth;c.className='lcard in';}g.busy=false;},230);
}
function lgEnd(){
  const s=S.session,g=X.lg;
  if(!g||g.over)return;
  g.over=true;stopTick();
  s.xp=(s.xp||0)+g.xp;S.xp=(S.xp||0)+g.xp;
  // Frase errada que passou como certa vira exercício de correção na revisão.
  g.missed.filter(m=>!m.ok).forEach(m=>S.review.push({id:'l'+Date.now()+Math.random().toString(36).slice(2,6),item:{type:'fix',sentence:m.s,answer:m.fix},box:0,due:addDays(1),note:m.fix}));
  s.lgResult={ok:g.ok,total:g.total,best:g.best,xp:g.xp,missed:g.missed};
  sfx(g.total&&g.ok/g.total>=0.7?'win':'ok');
  if(g.total&&g.ok/g.total>=0.7)pendingCelebrate=true;
  X.lg=null;touch();save();render();window.scrollTo(0,0);
  if(pendingCelebrate){pendingCelebrate=false;confetti();}
}
function afterLightning(){
  const s=S.session;
  s.phase=s.lesson.writing?'writing':'summary';
  resetX();
  if(s.phase==='summary')finishSession();
  touch();save();render();window.scrollTo(0,0);
}

/* ---------- escrita ---------- */
function vWriting(s){
  const w=s.writing,task=s.lesson.writing;
  if(w&&w.done){
    const models=(task&&task.models)||[];
    return `<div class="page stack">
      <div class="kind">Escrita. <span class="xpgain" style="margin-left:0;font-size:1.3rem">+${w.xp||0} XP</span></div>

      <p class="muted small">Compare frase por frase: o verbo está na forma certa? Faltou alguma palavra? Não precisa ficar igual; o modelo é uma das formas possíveis.</p></div>`:''}
    <div class="page stack">
      <p>Quer correção de verdade hoje? Copie e cole no chat do Claude. Só gasta o seu limite quando você escolher.</p>
      <div class="row"><button class="btn ghost" data-act="copyWriting">${X.copied?'Copiado!':'Copiar para corrigir no Claude'}</button></div>
    </div>

  }
  return `<div class="page">
    <div class="kind">Escrita: última parte da partida</div>
    <h2>${esc(task.task)}</h2>

    <div class="row" style="margin-top:14px"><button class="btn" data-act="sendWriting">Terminei</button>
    <button class="btn link" data-act="skipWriting">Pular a escrita hoje</button></div>
  </div>`;
}
function sendWriting(){
  const s=S.session,t=document.getElementById('wtext');
  const text=(t?t.value:'').trim();X.input=text;
  if(text.split(/\s+/).length<8){showError('Escreva pelo menos 2 ou 3 frases antes de continuar.');return;}
  document.getElementById('errbar').hidden=true;
  s.xp=(s.xp||0)+10;S.xp=(S.xp||0)+10;
  s.writing={text,done:true,xp:10};
  sfx('ok');X.input='';touch();save();render();window.scrollTo(0,0);
}
function copyWriting(){
  const s=S.session;
  const txt=`Corrija meu texto em inglês. Sou brasileiro, nível ${s.level}.\nTarefa: ${s.lesson.writing.task}\nMeu texto:\n${s.writing.text}\n\nAponte cada erro, explique em português e reescreva de forma natural no meu nível.`;
  const ok=()=>{X.copied=true;render();};
  const fallback=()=>{
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    let done=false;try{done=document.execCommand('copy');}catch(e){}
    ta.remove();
    if(done)ok();else showError('Não consegui copiar automaticamente. Selecione o seu texto acima e copie à mão.');
  };
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
}

/* ---------- resultado da aula ---------- */
function finishSession(){
  const s=S.session;
  const n=s.results.length,ok=s.results.filter(r=>r&&r.ok).length;
  const score=n?Math.round(ok/n*100):0;
  const per={};
  s.items.forEach((it,i)=>{const k=SKILL[it.type];if(!k)return;per[k]=per[k]||[0,0];per[k][1]++;if(s.results[i]&&s.results[i].ok)per[k][0]++;});
  for(const k in per){S.skills[k].push(Math.round(per[k][0]/per[k][1]*100));S.skills[k]=S.skills[k].slice(-10);}
  const wScore=s.writing&&s.writing.result?s.writing.result.score:null;
  if(wScore!=null){S.skills.writing.push(wScore);S.skills.writing=S.skills.writing.slice(-10);}
  const today=ymd();
  S.history.push({date:today,level:s.level,topic:s.topic,score,writing:wScore,kind:s.kind});
  if(S.lastDone!==today){S.streak=(S.lastDone===addDays(-1))?S.streak+1:1;S.lastDone=today;}
  s.stars=score>=90?3:score>=70?2:score>=40?1:0;
  S.stars=S.stars||{};S.stars[s.level]=S.stars[s.level]||{};
  const skey=s.boss?'boss':String(s.topicIdx);
  S.stars[s.level][skey]=Math.max(S.stars[s.level][skey]||0,s.stars);
  let extra=0;
  if(s.boss){
    s.advanced=false;
    s.bossPassed=score>=80&&s.level===S.level;
    if(s.bossPassed){
      const nx=LEVELS[LEVELS.indexOf(s.level)+1];extra=100;
      if(nx){S.level=nx;if(S.topicIdx[nx]==null)S.topicIdx[nx]=0;s.worldUp=nx;}
      else{S.champion=true;s.champion=true;}
    }
  }else{
    const before=Math.min(S.topicIdx[s.level]||0,SYL[s.level].length);
    s.advanced=score>=70&&s.level===S.level;
    if(s.advanced)S.topicIdx[s.level]=Math.max(S.topicIdx[s.level]||0,s.topicIdx+1);
    s.unlocked=s.advanced&&s.topicIdx+1>before?(s.topicIdx+1>=SYL[s.level].length?'boss':s.topicIdx+2):null;
  }
  s.bonus=20+(score===100?30:0)+extra;s.xp=(s.xp||0)+s.bonus;S.xp=(S.xp||0)+s.bonus;
  if(s.xpStart==null)s.xpStart=S.xp-s.xp;
  s.score=score;s.phase='summary';
  sfx('win');pendingCelebrate=true;
  S.levelUpReady=false;
}
function vSummary(s){
  const wrong=s.items.filter((it,i)=>!(s.results[i]&&s.results[i].ok)).length;
  const stars=s.stars!=null?s.stars:(s.score>=90?3:s.score>=70?2:s.score>=40?1:0);
  const before=rankOf(s.xpStart||0).lvl,after=rankOf(S.xp).lvl;
  let status;
  if(s.boss){
    status=s.bossPassed
      ?(s.worldUp?`<div class="unlock">Chefão derrotado! O mundo ${s.worldUp} (${esc(LEVEL_NAME[s.worldUp])}) está aberto. +100 XP de bônus.</div>`
                 :`<div class="unlock">Chefão final derrotado! Você completou todos os mundos. +100 XP de bônus.</div>`)
      :`<p>O chefão venceu desta vez: precisa de 80% e você fez ${s.score}%. Refaça as fases com menos estrelas e volte para a revanche.</p>`;
  }else{
    status=s.unlocked?`<div class="unlock">${s.unlocked==='boss'?'Todas as fases concluídas! O chefão do mundo está liberado.':'Fase '+s.unlocked+' desbloqueada!'}</div>`
      :s.advanced?'<p>Fase concluída. Jogue de novo quando quiser para buscar mais estrelas.</p>'
      :'<p>Abaixo de 70%. Jogue esta fase de novo para liberar a próxima. As questões são sempre novas.</p>';
  }
  return `<div class="talk">${mascot(stars>=2?'cheer':'happy',84)}<div class="bubble">${s.worldUp||s.champion?'Mundo novo à vista!':stars===3?'Partida perfeita!':stars===2?'Mandou muito bem!':'Partida concluída. Amanhã tem mais!'}</div></div>
  <div class="page stack art art-top" style="--art:url('assets/arte/trofeu.jpg')">
    <div class="kind">Partida concluída</div>
    <div class="stars" aria-label="${stars} de 3 estrelas">${[0,1,2].map(k=>`<span class="${k<stars?'on':'off'}">★</span>`).join('')}</div>
    ${after>before?`<div class="levelup">Você subiu para o nível ${after} de jogador: ${esc(rankTitle(after))}!</div>`:''}
    <div class="reward">
      <div><b>+<span data-count="${s.xp||0}">${s.xp||0}</span></b>XP</div>
      <div><b><span data-count="${s.score}">${s.score}</span>%</b>acertos</div>
      <div><b><span data-count="${s.maxCombo||0}">${s.maxCombo||0}</span></b>maior combo</div>
    </div>
    <p class="flame"><span class="f">🔥</span> ${currentStreak()} ${currentStreak()===1?'dia seguido':'dias seguidos'}</p>
    ${status}
    ${wrong?`<p class="muted">${wrong} ${wrong===1?'item errado entrou':'itens errados entraram'} na revisão e ${wrong===1?'volta':'voltam'} a partir de amanhã.</p>`:''}
    <div class="row"><button class="btn" data-act="closeSession">Voltar ao mapa</button></div>
  </div>`;
}

/* ---------- ações ---------- */
const ACT={
  startPlacement,
  placeSel:a=>{P.sel=+a;render();},
  placeNext:()=>{const it=P.block[P.i];placeAnswer(it.opts[P.sel]===it.right);},
  placeDontKnow:()=>placeAnswer(false),
  mapTap:a=>{mapSel=+a;render();},
  closePop:()=>{mapSel=null;render();},
  playPhase:a=>{
    if(S.session&&!confirm('Você tem uma partida em andamento. Começar outra descarta a atual. Continuar?'))return;
    S.session=null;mapSel=null;newLesson(a);
  },
  pairL:(a,el)=>pairTap('L',+a,el),
  pairR:(a,el)=>pairTap('R',+a,el),
  lgStart,
  lgAns:a=>lgAnswer(a==='1'),
  lgDone:afterLightning,
  goHome:()=>{stopTick();X.lg=null;mapSel=null;homeScroll=true;view=S.level?'home':'welcome';render();window.scrollTo(0,0);},
  newLesson,
  override,
  copyWriting,
  exportProg:exportProgress,
  importProg:()=>{const f=document.getElementById('importFile');if(f){f.value='';f.click();}},
  resume:()=>{const s=S.session;lastBar=s&&s.items.length?s.i/s.items.length*100:0;resetX();view='lesson';render();},
  discard:()=>{if(confirm('Descartar a aula em andamento? O que você já respondeu fica registrado na revisão.')){S.session=null;touch();save();render();}},
  retry:()=>{if(failRetry)failRetry();},
  levelUp:()=>{const n=LEVELS[LEVELS.indexOf(S.level)+1];if(!n)return;S.level=n;if(S.topicIdx[n]==null)S.topicIdx[n]=0;S.levelUpReady=false;S.session=null;touch();save();render();},
  retest:()=>{if(confirm('Refazer o teste de nível? Seu histórico e suas revisões continuam guardados.'))startPlacement();},
  toEx:()=>{lastBar=0;S.session.phase='ex';resetX();touch();save();render();window.scrollTo(0,0);},
  toggleSound:()=>{S.sound=S.sound===false;touch();save();render();},
  say:a=>speak(a,1),
  saySlow:a=>speak(a,.7),
  sel:a=>{X.sel=+a;render();},
  pick:a=>{const k=+a;if(!X.order.includes(k)){X.order.push(k);X.picked=X.order.length-1;}render();X.picked=-1;},
  unpick:a=>{X.order.splice(+a,1);render();},
  check:()=>check(),
  dontKnow:()=>{const inp=document.getElementById('ans');if(inp)X.input=inp.value;X.ok=false;done();},
  next,
  sendWriting:()=>sendWriting(),
  skipWriting:()=>{S.session.phase='summary';finishSession();touch();save();render();},
  toSummary:()=>{finishSession();touch();save();render();window.scrollTo(0,0);},
  closeSession:()=>{mapSel=null;homeScroll=true;S.session=null;touch();save();view='home';render();window.scrollTo(0,0);}
};
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(!f){showError('Ação desconhecida: '+b.dataset.act);return;}
  f(b.dataset.arg,b);
});
app.addEventListener('change',e=>{if(e.target.id==='importFile'&&e.target.files&&e.target.files[0])importProgress(e.target.files[0]);});
app.addEventListener('input',e=>{if(e.target.id==='ans'||e.target.id==='wtext')X.input=e.target.value;});
document.addEventListener('keydown',e=>{
  if(view!=='lesson'||!X.lg||X.lg.over)return;
  if(e.key==='ArrowLeft'){e.preventDefault();lgAnswer(false);}
  else if(e.key==='ArrowRight'){e.preventDefault();lgAnswer(true);}
});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.id!=='ans'||e.target.tagName!=='INPUT')return;
  e.preventDefault();
  if(!X.checked&&!X.busy)check();
});

/* ---------- Rádio 013: músicas do Quiz CBJR V2 enquanto joga ---------- */
// Os MP3 ficam no repositório do Quiz; aqui só se aponta para eles. Se um endereço
// falhar, tenta o próximo (GitHub Pages do Quiz, Vercel, arquivo direto do GitHub).
const RADIO_BASES=['https://charlibriano.github.io/Quiz-CBJR-V2/','https://cbjr013.vercel.app/','https://raw.githubusercontent.com/charlibriano/Quiz-CBJR-V2/main/'];
const RADIO_KEY='cbjr-english-radio';
const WORLD_DISC={A1:0,A2:1,B1:2,B2:3,C1:4};
const R=window.RADIO013||null;
let RS={album:'world',shuffle:false,vol:.5,base:0};
try{Object.assign(RS,JSON.parse(localStorage.getItem(RADIO_KEY)||'{}'));}catch(e){}
if(RS.album==='all'){RS.album='world';RS.shuffle=true;}  // opção antiga "todos os discos" virou o próprio aleatório
let rQueue=[],rQi=0,rFails=0,rDuck=false;
const plAudio=document.getElementById('plAudio');
function radioSave(){try{localStorage.setItem(RADIO_KEY,JSON.stringify(RS));}catch(e){}}
function radioDuck(on){rDuck=on;if(plAudio)plAudio.volume=on?Math.min(RS.vol,.08):RS.vol;}
function radioAlbumIdx(){if(RS.shuffle)return 'all';return RS.album==='world'?(WORLD_DISC[S.level]!=null?WORLD_DISC[S.level]:0):RS.album;}
function radioCover(ai){return ai<5?'assets/capas/cd'+(ai+1)+'.jpeg':RADIO_BASES[RS.base]+R[ai].c;}
function radioBuild(){
  const al=radioAlbumIdx();
  let q=al==='all'?R.flatMap((a,ai)=>a.t.map((_,ti)=>[ai,ti])):R[al].t.map((_,ti)=>[al,ti]);
  if(al==='all')q=shuffle(q);
  rQueue=q;rQi=0;
}
function radioLoad(){
  const [ai,ti]=rQueue[rQi];
  plAudio.src=RADIO_BASES[RS.base]+R[ai].t[ti].u.replace(/^\.\//,'');
  plAudio.volume=rDuck?Math.min(RS.vol,.08):RS.vol;
  radioUI();
}
function radioPlay(){
  if(!rQueue.length)radioBuild();
  if(!plAudio.getAttribute('src'))radioLoad();
  const p=plAudio.play();
  if(p&&p.catch)p.catch(e=>{if(e&&!['AbortError','NotAllowedError','NotSupportedError'].includes(e.name))showError('A rádio não conseguiu tocar: '+e.message);});
}
function radioStep(d){
  if(!rQueue.length)radioBuild();
  if(d<0&&plAudio.currentTime>3){plAudio.currentTime=0;return;}
  rQi=(rQi+d+rQueue.length)%rQueue.length;
  radioLoad();radioPlay();
}
function radioChoose(al){
  // escolher um disco toca ele na ordem e desliga o aleatório
  RS.album=al==='world'?al:+al;RS.shuffle=false;radioSave();
  radioBuild();radioLoad();radioPlay();radioPanel(true);
}
function radioUI(){
  const btn=document.getElementById('plPlay'),on=!plAudio.paused;
  document.getElementById('radio').classList.toggle('on',on);
  btn.innerHTML=on?'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
  btn.setAttribute('aria-label',on?'Pausar':'Tocar');
  const cur=rQueue[rQi];
  if(!cur)return;
  const [ai,ti]=cur,a=R[ai],t=a.t[ti];
  document.getElementById('plTitle').textContent=t.n;
  const cv=document.getElementById('plOpen');
  cv.innerHTML=`<img src="${radioCover(ai)}" alt="" onerror="this.replaceWith(document.createTextNode('🎵'))">`;
  if('mediaSession' in navigator&&window.MediaMetadata){
    try{navigator.mediaSession.metadata=new MediaMetadata({title:t.n,artist:'Charlie Brown Jr.',album:a.a,artwork:[{src:new URL(radioCover(ai),location.href).href}]});}catch(e){}
  }
  if(!document.getElementById('plPanel').hidden)radioPanel(true);
}
function radioPanel(show){
  const pn=document.getElementById('plPanel');
  document.getElementById('plOpen').setAttribute('aria-expanded',show?'true':'false');
  if(!show){pn.hidden=true;return;}
  const cur=rQueue[rQi],al=RS.album;
  const wi=WORLD_DISC[S.level]!=null?WORLD_DISC[S.level]:0;
  pn.innerHTML=`
    <div class="pl-now">${cur?`<img src="${radioCover(cur[0])}" alt="" onerror="this.remove()">`:''}
      <div><div class="kind">Rádio 013</div><div class="pl-song">${cur?esc(R[cur[0]].t[cur[1]].n):'Escolha um disco e dê o play'}</div><div class="muted small">${cur?esc(R[cur[0]].a)+' ('+R[cur[0]].y+')':''}</div></div></div>
    <label class="pl-row">Volume <input type="range" id="plVol" min="0" max="1" step="0.05" value="${RS.vol}"></label>
    <label class="pl-row"><input type="checkbox" id="plShuf" ${RS.shuffle?'checked':''}> Aleatório em todos os discos</label>
    <p class="muted small" style="margin:4px 0 8px">A música abaixa sozinha quando o jogo fala uma frase em inglês.</p>
    <div class="kind">Escolha o disco</div>
    <div class="pl-albums">
      <button class="pl-al ${!RS.shuffle&&al==='world'?'on':''}" data-al="world">Disco do seu mundo <small>(${esc(R[wi].a)})</small></button>
      ${R.map((a,i)=>`<button class="pl-al ${!RS.shuffle&&al===i?'on':''}" data-al="${i}">${esc(a.a)} <small>${a.y}</small></button>`).join('')}
    </div>`;
  pn.hidden=false;
}
if(R&&R.length&&plAudio){
  document.getElementById('radio').hidden=false;
  document.getElementById('plPlay').addEventListener('click',()=>{plAudio.paused?radioPlay():plAudio.pause();});
  document.getElementById('plNext').addEventListener('click',()=>radioStep(1));
  document.getElementById('plPrev').addEventListener('click',()=>radioStep(-1));
  document.getElementById('plOpen').addEventListener('click',e=>{e.stopPropagation();radioPanel(document.getElementById('plPanel').hidden);});
  const pn=document.getElementById('plPanel');
  pn.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-al]');if(b)radioChoose(b.dataset.al);});
  pn.addEventListener('input',e=>{
    if(e.target.id==='plVol'){RS.vol=+e.target.value;radioSave();if(!rDuck)plAudio.volume=RS.vol;}
    if(e.target.id==='plShuf'){
      // a música atual continua tocando; a fila seguinte é que muda
      RS.shuffle=e.target.checked;radioSave();
      const cur=rQueue[rQi];radioBuild();
      if(cur){const k=rQueue.findIndex(x=>x[0]===cur[0]&&x[1]===cur[1]);if(k>=0)rQi=k;if(RS.shuffle&&k>=0){rQueue.splice(k,1);rQueue.unshift(cur);rQi=0;}}
      radioPanel(true);
    }
  });
  document.addEventListener('click',()=>{if(!pn.hidden)radioPanel(false);});
  plAudio.addEventListener('play',radioUI);
  plAudio.addEventListener('pause',radioUI);
  plAudio.addEventListener('playing',()=>{rFails=0;});
  plAudio.addEventListener('ended',()=>radioStep(1));
  plAudio.addEventListener('error',()=>{
    if(!plAudio.getAttribute('src'))return;
    if(RS.base<RADIO_BASES.length-1){RS.base++;radioSave();radioLoad();radioPlay();return;}
    rFails++;
    if(rFails<3){radioStep(1);return;}
    plAudio.pause();
    showError('A rádio não conseguiu carregar as músicas do Quiz CBJR. Testei o GitHub Pages do Quiz, a Vercel e o arquivo direto no GitHub.');
  });
  if('mediaSession' in navigator){
    try{
      navigator.mediaSession.setActionHandler('play',radioPlay);
      navigator.mediaSession.setActionHandler('pause',()=>plAudio.pause());
      navigator.mediaSession.setActionHandler('nexttrack',()=>radioStep(1));
      navigator.mediaSession.setActionHandler('previoustrack',()=>radioStep(-1));
    }catch(e){}
  }
}

/* ---------- início ---------- */
loadLocal();
view=S.level?'home':'welcome';
render();
</script>
